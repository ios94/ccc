name: Extract AshteMobile zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip into the repository
        run: |
          mkdir -p /tmp/x
          unzip -q AshteMobile.zip -d /tmp/x
          rsync -a --exclude '.github' --exclude '.git' /tmp/x/AshteMobile/ ./
          rm -f AshteMobile.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract AshteMobile project files"
          git push
