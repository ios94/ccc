name: Extract install-fix zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip into the repository
        run: |
          test -f install-fix.zip
          mkdir -p /tmp/x
          unzip -q install-fix.zip -d /tmp/x
          # If the repo was already renamed to AshteMobile, move the files there
          # and apply the same rename inside them.
          if [ -d AshteMobile ] && [ ! -d Feather ]; then
            mv /tmp/x/changed/Feather /tmp/x/changed/AshteMobile
            if [ -f /tmp/x/changed/AshteMobile/FeatherApp.swift ]; then
              mv /tmp/x/changed/AshteMobile/FeatherApp.swift /tmp/x/changed/AshteMobile/AshteMobileApp.swift
            fi
            find /tmp/x/changed -type f -name '*.swift' -print0 | xargs -0 perl -CSD -pi -e '
              next if /github\.com\/[^\s"]*Feather/;
              s/NSPersistentContainer\(name: "Feather"\)/NSPersistentContainer(name: "__KEEP_FEATHER__")/g;
              s/Feather/AshteMobile/g;
              s/__KEEP_FEATHER__/Feather/g;
            '
          fi
          rsync -a /tmp/x/changed/ ./
          rm -f install-fix.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Settings as pushed page, language default, my sources" || echo "nothing to commit"
          git push
