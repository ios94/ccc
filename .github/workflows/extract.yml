name: Extract install-fix zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip into the repository
        run: |
          test -f install-fix.zip
          mkdir -p /tmp/x
          unzip -q install-fix.zip -d /tmp/x
          # replace the old icon files completely
          rm -rf Feather/Resources/AppIcon.icon Feather/Resources/Assets.xcassets/AppIcon.appiconset
          rsync -a /tmp/x/changed/ ./
          rm -f install-fix.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "AshteMobile UI: settings, language, logo, branding" || echo "nothing to commit"
          git push
