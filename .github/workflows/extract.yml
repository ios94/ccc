name: Extract language-fix zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip into the repository
        run: |
          set -e
          ZIP="zzz-main-fixed.zip"
          test -f "$ZIP" || { echo "::error::$ZIP not found in the repo root. Upload it first."; exit 1; }

          rm -rf /tmp/x && mkdir -p /tmp/x
          unzip -q "$ZIP" -d /tmp/x

          # The zip contains one top-level folder (zzz-main/). Use it as the source.
          SRC="$(find /tmp/x -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SRC" || SRC=/tmp/x
          echo "Source folder: $SRC"

          # Copy everything into the repo root.
          # - .git is never touched.
          # - .github is skipped: the default GITHUB_TOKEN is not allowed to push
          #   workflow files, so the push would be rejected.
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude "$ZIP" \
            "$SRC"/ ./

          rm -f "$ZIP"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix app language: all screens follow the selected language (English / Arabic / Kurdish)" || echo "nothing to commit"
          git push
